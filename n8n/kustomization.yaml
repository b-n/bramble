apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n
images:
- name: docker.io/n8nio/n8n
  newTag: 2.34.4
  digest: sha256:f69bad7a699300702af665b9f13fc67455b93c9fb9174bca6c37f3d4a47b8583
resources:
# Dependencies: infra
- gateway.yaml
- httproute.yaml
- certificate.yaml
- ../ext/middlewares
# Dependencies: postgres
- configmap-postgres.yaml
- statefulset-postgres.yaml
- service-postgres.yaml
# Main deployment
- configmap-n8n-env.yaml
- deployment-n8n.yaml
- service-n8n.yaml
generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: n8n
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - secret-postgres.enc.yaml
  - secret-n8n-env.enc.yaml
