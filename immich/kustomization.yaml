---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

images:
- name: ghcr.io/immich-app/immich-server
  newTag: v2.7.5
- name: ghcr.io/immich-app/immich-machine-learning
  newTag: v2.7.5
- name: valkey/valkey
  newTag: 9.1.0
- name: ghcr.io/immich-app/postgres
  newTag: 18-vectorchord0.5.3-pgvector0.8.1

resources:
- ../ext/iscsi
- ../ext/middlewares
- ns.yaml
- certificate.yaml
- gateway.yaml
- httproute.yaml
- httproute-local.yaml
# Postgres
- configmap-postgres.yaml
- statefulset-postgres.yaml
- service-postgres.yaml
# Valkey
- deployment-valkey.yaml
- service-valkey.yaml
# Immich
- configmap-immich-env.yaml
- deployment-server.yaml
- deployment-ml.yaml
- service-immich.yaml
- service-ml.yaml
# Backup
- cronjob-backup.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: immich
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secret-postgres.enc.yaml
  - ./secret-immich.enc.yaml
  - ./secret-immich-backup.enc.yaml
  - ./configmap-immich-backup.enc.yaml
