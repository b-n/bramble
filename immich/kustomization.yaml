resources:
- ../ext/iscsi
- ../ext/middlewares
- ns.yaml
- certificate.yaml
- gateway.yaml
- httproute.yaml
- httproute-local.yaml
# Postgres
- configmap-postgres.yaml
- statefulset-postgres.yaml
- service-postgres.yaml
# Valkey
- deployment-valkey.yaml
