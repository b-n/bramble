apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nfs
  namespace: kube-system
spec:
  chart: nfs-subdir-external-provisioner
  repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  targetNamespace: nfs
  valuesContent: |-
    nfs:
      server: 192.168.64.253
      path: /volume1/k3s-nfs
    storageClass:
      name: nfs
