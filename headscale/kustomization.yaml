apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headscale
resources:
# Dependencies: infra
- gateway.yaml
- httproute.yaml
- certificate.yaml
- ../ext/middlewares
# Main deployment
- statefulset-headscale.yaml
- statefulset-headplane.yaml
- service-headscale.yaml
- service-headplane.yaml
configMapGenerator:
- name: headscale-config
  files:
  - config-headscale.yaml
- name: headscale-headplane-config
  files:
  - config-headplane.yaml
generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: headscale
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - secret-headscale-keys.enc.yaml
  - secret-headplane.enc.yaml
images:
- name: ghcr.io/juanfont/headscale
  newTag: v0.29.5
  digest: sha256:780ed2f9e85719a2211277433f2c8afb45105d0d25031949a6848a485f9e216d
- name: ghcr.io/tale/headplane
  newTag: 0.8.2
  digest: sha256:b053a0a6699d0a67be3f0d9bae8e7dbe35ed67ae8448412adcbad7ea49866faa
