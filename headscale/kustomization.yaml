apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headscale
resources:
# Dependencies: infra
- gateway.yaml
- httproute.yaml
- certificate.yaml
- ../ext/middlewares
# Main deployment
- statefulset-headscale.yaml
- statefulset-headplane.yaml
- service-headscale.yaml
- service-headplane.yaml
configMapGenerator:
- name: headscale-config
  files:
  - config-headscale.yaml
- name: headscale-headplane-config
  files:
  - config-headplane.yaml
generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: headscale
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - secret-headscale-keys.enc.yaml
  - secret-headplane.enc.yaml
images:
- name: ghcr.io/juanfont/headscale
  newTag: v0.29.3
  digest: sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
- name: ghcr.io/tale/headplane
  newTag: 0.7.1
  digest: sha256:394483fd2336ce6b15df360c3e118ddfd45eb8140fe21df9f2611077f5d79d22
