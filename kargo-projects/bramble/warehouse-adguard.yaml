apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: adguard
spec:
  subscriptions:
  - image:
      repoURL: docker.io/adguard/adguardhome
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  - git:
      repoURL: https://github.com/b-n/bramble.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "adguard/"
      excludePaths:
      - "glob:*.md"
