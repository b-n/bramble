apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: headscale
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/tale/headplane
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  - image:
      repoURL: docker.io/headscale/headscale
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  - git:
      repoURL: https://github.com/b-n/bramble.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "adguard/"
      excludePaths:
      - "glob:*.md"
