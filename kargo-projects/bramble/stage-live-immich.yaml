apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: live-immich
spec:
  vars:
  - name: appName
    value: bramble-immich
  - name: appPath
    value: immich
  - name: gitopsRepo
    value: https://github.com/b-n/bramble.git
  promotionTemplate:
    spec:
      steps:
      - task:
          name: containers
          kind: ClusterPromotionTask
  requestedFreight:
  - origin:
      kind: Warehouse
      name: immich
    sources:
      direct: true
