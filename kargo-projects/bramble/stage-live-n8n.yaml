apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: live-n8n
spec:
  vars:
  - name: appName
    value: bramble-n8n
  - name: appPath
    value: n8n
  - name: gitopsRepo
    value: https://github.com/b-n/bramble.git
  promotionTemplate:
    spec:
      steps:
      - task:
          name: argo-set-image
          kind: ClusterPromotionTask
  requestedFreight:
  - origin:
      kind: Warehouse
      name: n8n
    sources:
      direct: true
