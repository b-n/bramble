apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: immich
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/immich-app/immich-server
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  - image:
      repoURL: ghcr.io/immich-app/immich-machine-learning
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  - image:
      repoURL: docker.io/valkey/valkey
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  # We don't autoupdate dbs
  #- image:
  #    repoURL: ghcr.io/immich-app/postgres
  #    discoveryLimit: 20
  #    imageSelectionStrategy: SemVer
  #    cacheByTag: true
  #    allowTagsRegexes:
  #    - "v[0-9]+\\.[0-9]+\\.[0-9]+$"
  #    platform: "linux/arm64"
  - git:
      repoURL: https://github.com/b-n/bramble.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "adguard/"
      excludePaths:
      - "glob:*.md"
