apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- appset.yaml

generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: kargo-projects
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - ./secret-docker-hub.enc.yaml
