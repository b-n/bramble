apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: discourse
spec:
  subscriptions:
  # Lexical because `-latest` suffix. We can change to real semver at 2027.01 release
  - image:
      repoURL: discourse/discourse
      discoveryLimit: 20
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      allowTagsRegexes:
      - "^[0-9]+\\.[0-9]+\\.[0-9]+-latest(-[0-9]+)+$"
      platform: "linux/amd64"
  - image:
      repoURL: docker.io/valkey/valkey
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/amd64"
      constraint: ^9.1.1
  - git:
      repoURL: https://codeberg.org/Techwerkers/manifests.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "hetzner/services/discourse/"
      excludePaths:
      - "glob:*.md"
