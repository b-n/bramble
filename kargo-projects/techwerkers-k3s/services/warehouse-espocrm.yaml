apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: espocrm
spec:
  subscriptions:
  - image:
      repoURL: docker.io/espocrm/espocrm
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/amd64"
  - git:
      repoURL: https://codeberg.org/Techwerkers/manifests.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "hetzner/services/espocrm/"
      excludePaths:
      - "glob:*.md"
