apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: docmost
spec:
  subscriptions:
  - image:
      repoURL: docker.io/docmost/docmost
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/amd64"
      constraint: ^8.10.1
  - image:
      repoURL: docker.io/library/redis
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+-alpine$"
      platform: "linux/amd64"
      constraint: ^8.10.1
  - git:
      repoURL: https://codeberg.org/Techwerkers/manifests.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "hetzner/services/docmost/"
      excludePaths:
      - "glob:*.md"
