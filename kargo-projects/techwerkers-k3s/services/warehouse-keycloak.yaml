apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: keycloak
spec:
  subscriptions:
  - image:
      repoURL: quay.io/keycloak/keycloak
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/arm64"
  - git:
      repoURL: https://codeberg.org/Techwerkers/manifests.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "services/keycloak/"
      excludePaths:
      - "glob:*.md"
