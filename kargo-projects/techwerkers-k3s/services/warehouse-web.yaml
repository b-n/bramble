apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: web
spec:
  subscriptions:
  - image:
      repoURL: docker.io/library/nginx
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      cacheByTag: true
      allowTagsRegexes:
      - "[0-9]+\\.[0-9]+\\.[0-9]+$"
      platform: "linux/amd64"
      constraint: ^1.31.3
  - git:
      repoURL: https://codeberg.org/Techwerkers/manifests.git
      branch: main
      commitSelectionStrategy: NewestFromBranch
      includePaths:
      - "hetzner/services/web/"
      excludePaths:
      - "glob:*.md"
