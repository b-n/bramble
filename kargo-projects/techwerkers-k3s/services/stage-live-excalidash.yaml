apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: live-excalidash
spec:
  vars:
  - name: appName
    value: twk3s-services-excalidash
  - name: appPath
    value: hetzner/services/excalidash
  - name: gitopsRepo
    value: https://codeberg.org/Techwerkers/manifests.git
  - name: extPath
    value: hetzner/ext
  promotionTemplate:
    spec:
      steps:
      - task:
          name: containers
          kind: ClusterPromotionTask
  requestedFreight:
  - origin:
      kind: Warehouse
      name: excalidash
    sources:
      direct: true
