apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
images:
- name: quay.io/keycloak/keycloak
  newTag: 26.8.2
  digest: sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
resources:
# Dependencies: infra
- gateway.yaml
- httproute.yaml
- httproute-local.yaml
- certificate.yaml
- ../ext/middlewares
# Dependencies: postgres
- configmap-postgres.yaml
- statefulset-postgres.yaml
- service-postgres.yaml
# Main deployment
- configmap-keycloak-env.yaml
- deployment-keycloak.yaml
- service-keycloak-discovery.yaml
- service-keycloak-admin.yaml
generators:
- |-
  apiVersion: viaduct.ai/v1
  kind: ksops
  metadata:
    name: keycloak
    annotations:
      config.kubernetes.io/function: |
        exec:
          path: ksops
  files:
  - secret-postgres.enc.yaml
  - secret-keycloak-env.enc.yaml
