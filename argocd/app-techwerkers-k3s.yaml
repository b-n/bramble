apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techwerkers-k3s
  namespace: argocd
spec:
  source:
    path: ./
    repoURL: https://codeberg.org/Techwerkers/manifests.git
    targetRevision: main
  # destination is bramble because we need the appset there
  destination:
    name: bramble
    namespace: main
  project: techwerkers-k3s
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - ApplyOutOfSyncOnly=true
