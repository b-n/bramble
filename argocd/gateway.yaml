---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
spec:
  gatewayClassName: traefik
  listeners:
  - name: websecure
    port: 9443
    protocol: HTTPS
    hostname: argocd.bennaylor.dev
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: argocd-tls
        namespace: argocd
