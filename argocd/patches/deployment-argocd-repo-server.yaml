apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
      - name: argocd-repo-server
        volumeMounts:
        - mountPath: /usr/local/bin/ksops
          name: custom-tools
          subPath: ksops
      initContainers:
      # KSOPS: Copy ksops binary to a shared volume
      - name: install-ksops
        image: viaductoss/ksops:v4.5.1
        command:
        - "/usr/local/bin/ksops",
        - "install",
        - "--with-kustomize",
        - "/custom-tools",
        volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
      serviceAccountName: argocd-repo-server
      # Add a new volume mount for custom-tools
      volumes:
      - emptyDir: {}
        name: custom-tools
