apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
      - name: argocd-repo-server
        env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
        volumeMounts:
        - mountPath: /usr/local/bin/kustomize
          name: custom-tools
          subPath: kustomize
        - mountPath: /usr/local/bin/ksops
          name: custom-tools
          subPath: ksops
        - mountPath: /.config/sops/age
          name: sops-age
      initContainers:
      - name: install-ksops
        image: viaductoss/ksops:v4.5.1
        command:
        - "/usr/local/bin/ksops"
        - "install"
        - "--with-kustomize"
        - "/custom-tools"
        volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
      serviceAccountName: argocd-repo-server
      volumes:
      - emptyDir: {}
        name: custom-tools
      - name: sops-age
        secret:
          secretName: argocd-age
