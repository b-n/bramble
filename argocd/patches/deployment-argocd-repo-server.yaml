apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
      - name: argocd-repo-server
        volumeMounts:
        - mountPath: /usr/local/bin/ksops
          name: custom-tools
          subPath: ksops
      initContainers:
      - name: install-ksops
        image: viaductoss/ksops:v4.5.1
        command:
        - "/usr/local/bin/ksops"
        - "install"
        - "--with-kustomize"
        - "/custom-tools"
        volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
      serviceAccountName: argocd-repo-server
      volumes:
      - emptyDir: {}
        name: custom-tools
