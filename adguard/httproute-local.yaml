---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-local
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: adguard
  hostnames:
  - adguard.home
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
      - group: ""
        kind: Service
        name: adguard-admin
        port: 3000
        weight: 1
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: local-only
